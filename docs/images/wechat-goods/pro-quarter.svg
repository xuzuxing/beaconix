<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f7fafd"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a6300"/>
      <stop offset="1" stop-color="#e0a92e"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a92e" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#e0a92e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e0a92e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9dbde4" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#9dbde4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 浅色渐变底 -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="178" cy="16" r="98" fill="url(#glowTop)"/>
  <circle cx="12" cy="206" r="112" fill="url(#glowBottom)"/>

  <!-- 品牌记号：三点信号格（呼应监控/探测，200px 下放不下完整字标） -->
  <g fill="url(#ink)">
    <circle cx="19" cy="27" r="1.6" fill-opacity="0.45"/>
    <circle cx="25" cy="27" r="2.1" fill-opacity="0.70"/>
    <circle cx="32" cy="27" r="2.6"/>
  </g>

  <!-- 右上角：周期标签（月卡 / 季卡 / 年卡） -->
  <g>
    <rect x="136" y="16" width="48" height="22" rx="11" fill="url(#ink)"/>
    <text x="160" y="31" text-anchor="middle" font-family="Microsoft YaHei" font-size="11" font-weight="700" fill="#ffffff">季卡</text>
  </g>

  <!-- 套餐名 -->
  <text x="18" y="69" font-family="Microsoft YaHei" font-size="26" font-weight="700" fill="#0f172a">专业版</text>
  <text x="19" y="85" font-family="Microsoft YaHei" font-size="8" letter-spacing="3" fill="#9a6300">PRO PLAN</text>

  <!-- 主体：大号有效期天数 -->
  <text x="100" y="152" text-anchor="middle" font-family="Microsoft YaHei" font-size="76" font-weight="700" fill="url(#ink)">90</text>
  <text x="100" y="170" text-anchor="middle" font-family="Microsoft YaHei" font-size="12" letter-spacing="3" fill="#94a3b8">天</text>
</svg>