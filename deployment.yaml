# =============================================================================
# beaconix API — k3s 部署清单
#
# 部署（Secret 必须先于 Deployment 就位）：
#   kubectl create namespace beaconix
#   kubectl -n beaconix create secret generic beaconix-secrets --from-env-file=.env.production
#   kubectl apply -f deployment.yaml
#   kubectl -n beaconix rollout status deploy/beaconix-app
#
# 文件分两节（Secret beaconix-secrets 由集群预先创建，本文件不包含）：
#   0) Namespace / ConfigMap                            —— 必需
#   1) 应用：PVC + Deployment + Service + Ingress       —— 必需
#
# 依赖说明：
#   PostgreSQL 与 Redis 均使用远程实例，不在本清单内。连接串放在 Secret
#   beaconix-secrets 的 DATABASE_URL / REDIS_URL（键名与格式见文末附录），并确认
#   远程侧允许 prod 节点 / Pod 网段连入。远程不可达时容器启动会先卡在
#   `prisma migrate deploy`，Pod 处于 CrashLoopBackOff 直到连通，这是预期行为。
#
# 节点调度：
#   应用 Pod 通过 nodeSelector 固定到带 node-role=prod 标签的 Worker（与平台方示例
#   一致）。部署前确认节点已打标签，否则 Pod 会一直 Pending：
#     kubectl get nodes -L node-role
#     kubectl label node <node-name> node-role=prod
#
# 副本数：
#   保持 1 副本。原因：/app/storage 是 local-path（ReadWriteOnce）卷，且镜像启动时
#   会先跑 prisma migrate deploy。若要按示例做成 2 副本高可用，需要先把附件存储换成
#   OSS 或 RWX 共享卷，并把迁移拆成独立 Job（之后才能安全改回 RollingUpdate）。
#
# 对外路由（同域名 beaconix.app 按路径分流）：
#   /api/*            → beaconix-app-svc  （Nest API，全局前缀就是 /api）
#   /storage/public/* → beaconix-app-svc  （公开附件静态目录，见 main.ts）
#   /*                → beaconix-web-svc （前端静态站，需与本次部署在同一命名空间、
#                                          监听 80；SPA history fallback 由 nginx 负责）
#
# 镜像：
#   默认使用本地镜像 beaconix-app:latest（与 docker-compose.yml 同名）。推到镜像
#   仓库后改成实际地址，例如 ghcr.io/your-org/beaconix:1.0.0。单节点 k3s 也可以
#   直接导入 containerd，免去拉取：
#     docker save beaconix-app:latest | sudo k3s ctr images import -
#
# 配置与密钥：
#   非敏感配置放在 ConfigMap beaconix-config（在本文件里，按环境改值即可）；
#   敏感配置（PostgreSQL / Redis 连接串、JWT 与加密密钥、支付 / 邮件凭据）放在
#   Secret beaconix-secrets —— 本文件只引用、不创建，仓库里不出现任何明文密钥。
#   部署前用下面任一方式在集群里建好（键名清单见文件末尾附录）：
#     kubectl -n beaconix create secret generic beaconix-secrets --from-env-file=.env.production
#     kubectl -n beaconix create secret generic beaconix-secrets \
#       --from-literal=DATABASE_URL='postgresql://…' \
#       --from-literal=JWT_SECRET="$(openssl rand -base64 32)" …
#   生产环境建议用 SealedSecrets / External Secrets Operator 把密文或外部密钥库
#   带进集群，密钥连副本都不进 Git。
#
# 部署前需要确认的值：
#   - ConfigMap beaconix-config：APP_WEB_URL / CORS_ORIGINS / BEACON_PUBLIC_API_URL
#   - Secret beaconix-secrets：DATABASE_URL / REDIS_URL 等（附录列出全部键）
#   - Ingress：host，以及需要 HTTPS 时的 tls.secretName
# =============================================================================


# -----------------------------------------------------------------------------
# 0. 命名空间与公共配置
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: beaconix
  labels:
    app.kubernetes.io/part-of: beaconix
---
# 非敏感配置：连接串 / 密钥一律走 Secret beaconix-secrets，不要写进这里
apiVersion: v1
kind: ConfigMap
metadata:
  name: beaconix-config
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/part-of: beaconix
data:
  NODE_ENV: "production"
  PORT: "3000"
  # 监听所有网卡，否则 Service 无法转发
  HOST: "0.0.0.0"
  APP_NAME: "beaconix"
  # 前端地址，用于邮件里的链接
  APP_WEB_URL: "https://beaconix.app"
  # 允许跨域的前端来源，逗号分隔；留空则关闭 CORS
  CORS_ORIGINS: "https://beaconix.app"
  # 容器内路径，与 Deployment 的 volumeMounts 对应
  STORAGE_PUBLIC_ROOT: "/app/storage/public"
  STORAGE_PRIVATE_ROOT: "/app/storage/private"
  # Redis 键前缀；连接地址（含 db 序号、密码）由 Secret 里的 REDIS_URL 决定
  REDIS_KEY_PREFIX: "beaconix:"
  REDIS_DB: "0"
  # 定时任务 cron 表达式使用的时区（IANA 名称）
  SCHEDULER_TIMEZONE: "Asia/Shanghai"
  PROBE_OFFLINE_AFTER_SECONDS: "180"
  # 探针安装命令中展示的 API 地址
  BEACON_PUBLIC_API_URL: "https://beaconix.app"
  # 日志交给 k3s 从 stdout 收集，不写文件
  LOGGER_SERVICE_NAME: "beaconix"
  LOGGER_DIR: "/app/logs"
  LOGGER_LEVEL: "info"
  LOGGER_PRETTY_PRINT: "false"
  LOGGER_TO_CONSOLE: "true"
  LOGGER_TO_FILE: "false"

---
# -----------------------------------------------------------------------------
# 1. 应用
# -----------------------------------------------------------------------------
# 附件与本地文件存储。local-path 是 k3s 自带存储类，使用节点本地磁盘。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beaconix-storage
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beaconix-app
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: beaconix
spec:
  # local-path 卷是 ReadWriteOnce，只能挂到单个节点，因此保持单副本。
  # 多副本需要把 /app/storage 换成 RWX 存储（NFS / 共享卷），或改用 OSS。
  replicas: 1
  revisionHistoryLimit: 5
  # 镜像启动时会先执行 `prisma migrate deploy`；Recreate 保证新旧 Pod 不会同时
  # 迁移。改成独立迁移 Job 之后可以切回 RollingUpdate 以支持零停机。
  strategy:
    type: Recreate
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: beaconix
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beaconix
        app.kubernetes.io/component: api
      annotations:
        # Prometheus 抓取（指标端点为 /api/metrics）。没有 Prometheus 时忽略即可。
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      # 【核心】强制调度到带有 prod 标签的 Worker 节点
      nodeSelector:
        node-role: prod
      # 私有镜像仓库需要认证时启用：
      # imagePullSecrets:
      #   - name: regcred
      # 应用监听 SIGTERM 优雅退出（enableShutdownHooks），留出收尾时间
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          # 改成实际镜像地址，例如 ghcr.io/your-org/beaconix:1.0.0
          image: registry.xuzuxing.cn/beaconix/beaconix:latest
          imagePullPolicy: IfNotPresent
          # 沿用镜像自带 CMD：prisma migrate deploy && node dist/src/main
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # 非敏感配置来自 ConfigMap；敏感配置来自集群里预建的 Secret
          # beaconix-secrets（不在本文件中，创建方式见文件头）
          envFrom:
            - configMapRef:
                name: beaconix-config
            - secretRef:
                name: beaconix-secrets
          volumeMounts:
            - name: storage
              mountPath: /app/storage
            - name: logs
              mountPath: /app/logs
          # 启动探针：给数据库迁移和 Nest 启动留出最多 5 分钟
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # 存活探针只判断进程是否还能响应，不依赖 DB / Redis，
          # 避免依赖抖动引发无谓重启
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # 就绪探针会真正检查 PostgreSQL 与 Redis；
          # 依赖不可用时摘掉流量，Pod 不重启
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # 【核心】给 Pod 分配合理的资源，防止单个应用把 4G 的 Worker 内存打爆
          # 注意：示例里的 64Mi/256Mi 是 nginx 量级，Node 22 + Prisma 会 OOMKilled，
          # 所以这里按实际占用给 512Mi 请求 / 1Gi 上限，再按节点内存调整。
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # 丢弃所有 capability，只保留 ICMP ping 所需的 NET_RAW
              # （监控功能会调用系统 ping）
              drop:
                - ALL
              add:
                - NET_RAW
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: beaconix-storage
        - name: logs
          emptyDir: {}
---
# 2. 业务内部服务 (Service)
apiVersion: v1
kind: Service
metadata:
  name: beaconix-app-svc
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: beaconix
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# 3. 对外暴露入口 (Ingress)
#    同一域名按路径分流（Ingress 按最长路径前缀优先匹配）：
#      /api            → beaconix-app-svc（API）
#      /storage/public → beaconix-app-svc（公开附件静态目录）
#      /               → beaconix-web-svc（前端静态站）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beaconix-app-ingress
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: api
  annotations:
    # k3s 默认安装 Traefik；没装 Traefik 就删掉 ingressClassName，交给默认 controller
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik   # 关键：指定由 Traefik 处理
  rules:
    - host: beaconix.app # 换成真实域名
      http:
        paths:
          # 后端 API。Nest 的全局前缀本身就是 /api，这里不需要 rewrite。
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: beaconix-app-svc
                port:
                  number: 80
          # 公开附件（头像 / 上传图片）由 API 进程在 /storage/public 下静态提供。
          # 改用 OSS / CDN 直链后这条可以删掉。
          - path: /storage/public
            pathType: Prefix
            backend:
              service:
                name: beaconix-app-svc
                port:
                  number: 80
          # 其余路径（含 /、前端路由、favicon、robots.txt）交给前端。
          # 需与本次部署在同一命名空间、Service 监听 80；名字不同就改 name。
          # Prometheus 抓取走 Pod 注解直连 3000，不经过这里。
          - path: /
            pathType: Prefix
            backend:
              service:
                name: beaconix-web-svc
                port:
                  number: 80
  # 需要 HTTPS 时挂证书（cert-manager 或已有 Secret），并把上面的注解改成
  # traefik.ingress.kubernetes.io/router.entrypoints: web,websecure：
  # tls:
  #   - hosts:
  #       - beaconix.app
  #     secretName: beaconix-tls


# =============================================================================
# 附录：Secret beaconix-secrets 的键清单（值只放进集群 / 密钥管理系统，不进仓库）
#
# 创建方式（二选一，先有命名空间）：
#   kubectl -n beaconix create secret generic beaconix-secrets --from-env-file=.env.production
#   kubectl -n beaconix create secret generic beaconix-secrets \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/beaconix?schema=public&sslmode=require' \
#     --from-literal=REDIS_URL='redis://:password@host:6379/0' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)" …
#
# 必填（缺任意一个，应用启动即失败 —— src/config 里走 requireEnv）：
#   DATABASE_URL          postgresql://user:pass@host:5432/db?schema=public&sslmode=require
#   REDIS_URL             redis://:password@host:6379/0
#   JWT_SECRET            随机串，建议 openssl rand -base64 32
#   JWT_REFRESH_SECRET    随机串
#   TWO_FACTOR_SECRET_KEY 32 字节 base64，加密 TOTP secret
#   MONITOR_SECRET_KEY    32 字节 base64，加密监控凭据
#
# 可选（不配则对应功能不可用）：
#   RESEND_API_KEY / RESEND_FROM_EMAIL / RESEND_FROM_NAME
#   WECHAT_PAY_* / WECHAT_VIRTUALPAY_* / ALIPAY_*
#   STORAGE_OSS_ENDPOINT / STORAGE_OSS_BUCKET /
#   STORAGE_OSS_ACCESS_KEY_ID / STORAGE_OSS_ACCESS_KEY_SECRET …
#
# 连接串注意：
#   - 密码含 @ : / ? # 等字符要做 URL 编码
#   - 公网 / 跨机房用 sslmode=require（能挂 CA 用 verify-full），同 VPC 无 TLS 用 disable
#   - connection_limit 按远程实例的 max_connections 预留，避免把连接数打满
#   - Redis 无密码写 redis://host:6379/0；ACL 用户写 redis://user:pass@host:6379/0
#
# 完整键名与说明见仓库的 .env.example。
# =============================================================================
