allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - pino-pretty@13.2.0

overrides:
  minimatch@<3.1.5: 3.1.5
  hono: 4.12.7
  '@hono/node-server': 1.19.10
  effect: 3.20.0

globalShims:
  pnpm: auto
  deno: auto
  bun: auto
  node: auto
