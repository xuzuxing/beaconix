version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 测试、构建、上传、发布、部署到自有主机
stages:
- name: 测试
  displayName: 测试
  strategy: naturally
  trigger: auto
  steps:
  - step: ut@nodejs
    name: ""
    displayName: Nodejs 单元测试
    nodeVersion: 24.13.0
    commands:
    - "# 设置NPM源，提升安装速度"
    - npm config set registry https://registry.npmmirror.com
    - "# 在这里输入测试命令"
    - npm install -g pnpm
    - pnpm install && pnpm test
    report:
      path: mochawesome-report
      index: mochawesome.html
    checkpoints:
      key: TestPassRate
      relationalOperator: '>='
      value: "0"
      logicalOperator: '&&'
    caches:
    - "~/.npm"
    - "~/.yarn"
    - "~/.pnpm"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: image-build-plus@buildkitd
    name: 02345aa7-11e6-4493-a4aa-27ae8c3da083
    displayName: 镜像构建 2.0
    tag: "${GITEE_PIPELINE_BUILD_NUMBER}"
    dockerfile: ./Dockerfile
    context: "."
    artifacts: []
    isCache: true
    processorType:
    - amd64
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
