version: "1.0"
name: 测试、构建、镜像构建、部署到Kubernetes集群
displayName: 测试、构建、镜像构建、部署到Kubernetes集群
stages:
- name: 测试
  displayName: 测试
  strategy: naturally
  trigger: auto
  steps:
  - step: ut@nodejs
    name: ""
    displayName: Nodejs 单元测试
    nodeVersion: 22.22.0
    commands:
    - "# 设置NPM源，提升安装速度"
    - npm config set registry https://registry.npmmirror.com
    - "# 安装依赖"
    - npm install pnpm -g
    - "# 在这里输入测试命令"
    - pnpm install && pnpm run test
    report:
      path: mochawesome-report
      index: mochawesome.html
    checkpoints:
      key: TestPassRate
      relationalOperator: '>='
      value: "0"
      logicalOperator: '&&'
    caches:
    - "~/.npm"
    - "~/.yarn"
    - "~/.pnpm"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: _1
    displayName: Nodejs 构建
    nodeVersion: 22.22.0
    commands:
    - "# 设置NPM源，提升安装速度"
    - npm config set registry https://registry.npmmirror.com
    - "# 安装依赖"
    - npm install pnpm -g
    - ""
    - "# 执行编译命令"
    - pnpm install && pnpm run build
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      type: .tar.gz
    caches:
    - "~/.npm"
    - "~/.yarn"
    - "~/.pnpm"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 镜像构建
  displayName: 镜像构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: _2
    displayName: 镜像构建
    type: cert
    certificate: b000dee0-b257-013f-9b2a-12538b38c6f4
    repository: registry.xuzuxing.cn/beaconix/beaconix
    tag: "${GITEE_PIPELINE_BUILD_NUMBER}"
    dockerfile: ./Dockerfile
    context: "."
    artifacts: "${BUILD_ARTIFACT}"
    isCache: true
    processorType:
    - amd64
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 部署
  displayName: 部署
  strategy: naturally
  trigger: auto
  steps:
  - step: deploy@k8s
    name: _3
    displayName: K8S部署
    version: v1.16.4
    certificate: d83cb8c0-b257-013f-6f11-6e67f497c5a2
    namespace: beaconix
    yaml: ./deployment.yaml
    isReplace: "true"
    skiptls: "true"
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
