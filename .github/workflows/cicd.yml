name: Node.js CI/CD with Docker & Kubernetes

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

env:
  REGISTRY: registry.xuzuxing.cn
  IMAGE_NAME: beaconix/beaconix

jobs:
  ci:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: TypeScript type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm exec jest --maxWorkers=2 --no-coverage

      - name: Offline business regression
        run: pnpm test:business:offline

      - name: Validate deployment paths
        run: pnpm exec tsx scripts/render-deployment.ts --prefix /api --output .tmp/deployment.yaml

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  docker:
    name: Build & Push Docker Image
    needs: ci
    # 只在 push 到 master 时构建推送，PR 只跑 CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录私有仓库
      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 如果配置了 environment，可以在 GitHub 里加审批卡点
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install manifest renderer
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Render deployment paths
        env:
          DEPLOY_PREFIX: ${{ vars.GLOBAL_PREFIX || '/api' }}
        run: pnpm exec tsx scripts/render-deployment.ts --prefix "$DEPLOY_PREFIX" --output .tmp/deployment.yaml

      - name: Update deployment image
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          sed -i "s|registry.xuzuxing.cn/beaconix/beaconix-app:latest|${FULL_IMAGE}|g" .tmp/deployment.yaml
          if ! grep -q "${FULL_IMAGE}" .tmp/deployment.yaml; then
            echo "镜像替换失败，请检查 deployment.yaml 中的默认镜像地址"
            exit 1
          fi
          kubectl apply --dry-run=client -f .tmp/deployment.yaml
          kubectl apply -f .tmp/deployment.yaml
          kubectl -n beaconix rollout status deploy/beaconix-app --timeout=180s

      - name: Stop on failure
        if: failure()
        run: |
          echo "Deployment failed. Confirm migration/schema compatibility before rollback; follow docs/guides/release-readiness.md."
          kubectl -n beaconix get deploy/beaconix-app
